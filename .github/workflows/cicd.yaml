name: CI/CD pipeline

on:
  push:
    branches: [ main ]

env:
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  DEBUG: ${{ vars.DEBUG }}
  ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}

  DB_NAME: ${{ vars.DB_NAME }}
  DB_USER: ${{ vars.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_PORT: ${{ vars.DB_PORT }}
  DB_HOST: ${{ vars.DB_HOST }}

jobs:
  lint:
    runs-on: ubuntu-latest
    environment: test 
  
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set Up Python
        uses: actions/setup-python@v6 
        with:
          python-version: '3.11'

      - name: Installing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint
      
      - name: Run Pylint
        run: pylint **/*.py --exit-zero
  test:
    runs-on: ubuntu-latest
    environment: test
    needs: [ lint ]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_USER: ${{ vars.DB_USER }}
          POSTGRES_DB: ${{ vars.DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

    - name: Checkout repository
      uses: actions/checkout@v5
    
    - name: Set Up Python
      uses: actions/setup-python@v6 
      with:
        python-version: '3.11'

    - name: Installing dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run migrations
      env:
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        DEBUG: ${{ vars.DEBUG }}
        ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
  
        DB_NAME: ${{ vars.DB_NAME }} 
        DB_USER: ${{ vars.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_HOST: ${{ vars.DB_HOST }}
        DB_PORT: 5432

      run: |
        cd Book_Library_System/library  
        python manage.py migrate

    - name: Run Tests
      run: |
        cd Book_Library_System/library/
        pytest


  security:
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    environment: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Run Bandit
        continue-on-error: true
        run: |
          mkdir -p reports
          bandit -r . -f json -o reports/bandit-report.json

      - name: Run pip-audit
        continue-on-error: true
        run: |
          pip-audit -f json -o reports/pip-audit-report.json

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    environment: test
    needs: [ test, security ]
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/library_system
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=semver,pattern={{version}}
    
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/library_system:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/library_system:buildcache,mode=max